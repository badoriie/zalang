name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      # The manifest test asserts against dist/, so this must run before tests.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Upload unpacked extension
        uses: actions/upload-artifact@v4
        with:
          name: zalang-unpacked
          path: dist/
          retention-days: 14
